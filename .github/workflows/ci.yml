name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: win64_msvc2022_64
            label: windows-x64
          - os: macos-14
            arch: clang_64
            cmake_arch: arm64
            label: macos-arm64
          - os: macos-15-intel
            arch: clang_64
            cmake_arch: x86_64
            label: macos-x64
          - os: ubuntu-24.04
            arch: linux_gcc_64
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}"
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath tailor-${{ matrix.label }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist tailor-${{ matrix.label }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf tailor-${{ matrix.label }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tailor-${{ matrix.label }}
          path: tailor-${{ matrix.label }}.*
          if-no-files-found: error
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git cmake g++ qt6-base-dev qt6-base-dev-tools qt6-svg-dev libgl-dev
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix dist
      - run: tar -C dist -czf tailor-linux-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tailor-linux-arm64
          path: tailor-linux-arm64.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tailor-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --notes \
            'Requires a separately installed SEGGER J-Link software package. macOS builds are not notarized. Linux archives require compatible Qt 6.8 runtime libraries; the ARM64 build targets Debian 13 / glibc 2.38 or newer.'
